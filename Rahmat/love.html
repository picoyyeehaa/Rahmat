<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Love You 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Great Vibes', cursive;
      background: radial-gradient(circle at top, #ffe6eb, #ffc0cb);
      color: #b30059;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
    }

    .heart {
      font-size: 6em;
      animation: heartbeat 1s infinite;
      margin-bottom: 20px;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    h1 {
      font-size: 3.5em;
      margin: 0;
    }

    p {
      font-size: 1.5em;
      margin-top: 10px;
      font-family: sans-serif;
    }

    .my-photo {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ff66a3;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    button {
      margin-top: 30px;
      background: #ff66a3;
      border: none;
      padding: 15px 30px;
      border-radius: 30px;
      color: white;
      font-size: 1.1em;
      cursor: pointer;
      transition: background 0.3s ease;
      z-index: 1;
    }

    button:hover {
      background: #e60073;
    }

    .flower {
      position: fixed;
      top: -50px;
      font-size: 24px;
      animation: fall linear infinite;
      opacity: 0.8;
      z-index: 0;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="heart">❤️</div>
  <h1>I Love You</h1>
  <p>Sayangku Rahmat 💕</p>

  
  <img src="coy2.jpg" alt="Gambar Saya" class="my-photo" />
 

  <button onclick="showMessage()">Sini Sayang 💌</button>

  <script>
    function showMessage() {
      alert("Sayangku, aku sayang sama kamu Rahmat. Aku sayang kamu lebih dari katakuu sayang. Cuma aku tak pandai nak tunjukkan gimana aku sayang sama kamu, 💖");
    }

    
    const flowers = ["🌸", "🌺", "💮"];
    for (let i = 0; i < 40; i++) {
      let flower = document.createElement("div");
      flower.className = "flower";
      flower.style.left = Math.random() * 100 + "vw";
      flower.style.animationDuration = (5 + Math.random() * 5) + "s";
      flower.style.fontSize = (16 + Math.random() * 16) + "px";
      flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
      document.body.appendChild(flower);
    }
  </script>
</body>
</html>
